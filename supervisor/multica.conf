# Cloudron stops containers with a 10 s grace period and supervisor stops the programs one after
# another (nginx, web, backend), so their stopwaitsecs add up to less than that.
[program:backend]
priority=10
directory=/app/code/backend
command=/app/pkg/app-env.sh /app/pkg/backend.sh
user=cloudron
autostart=true
autorestart=true
startsecs=10
stopsignal=TERM
stopwaitsecs=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
priority=20
directory=/app/code/web
command=/app/pkg/app-env.sh env HOSTNAME=127.0.0.1 PORT=3000 NODE_ENV=production node apps/web/server.js
user=cloudron
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
priority=30
directory=/run/multica
command=nginx -e stderr -c /app/pkg/nginx.conf -g "daemon off;"
user=cloudron
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stopwaitsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
