# Public entry point on port 8000, behind Cloudron's reverse proxy: Multica's recommended
# same-origin layout (SELF_HOSTING_ADVANCED.md, "Same Origin"). WebSockets and the backend's own
# paths go straight to the Go backend; everything else is the Next.js web app (which would proxy
# the same paths to the backend itself, but not WebSocket upgrades, and with a smaller body limit).
worker_processes 2;
pid /run/multica/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    client_body_temp_path /run/multica/nginx/client_body;
    proxy_temp_path /run/multica/nginx/proxy;
    fastcgi_temp_path /run/multica/nginx/fastcgi;
    uwsgi_temp_path /run/multica/nginx/uwsgi;
    scgi_temp_path /run/multica/nginx/scgi;

    # The client address as seen by Cloudron's reverse proxy (X-Real-IP), trusted only from that
    # proxy (set_real_ip_from is written by start.sh from CLOUDRON_PROXY_IP).
    include /run/multica/nginx-http.conf;
    real_ip_header X-Real-IP;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream backend {
        server 127.0.0.1:8080;
    }

    upstream web {
        server 127.0.0.1:3000;
    }

    server {
        listen 8000 default_server;
        listen [::]:8000 default_server;
        server_name _;

        # The backend accepts uploads up to 100 MB (handler/file.go maxUploadSize).
        client_max_body_size 105m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, never append: the backend trusts these only from 127.0.0.1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;

        # Realtime: browser (/ws) and agent daemons (/api/daemon/ws). Long-lived, unbuffered.
        location = /ws {
            proxy_pass http://backend;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        location /ws/ {
            proxy_pass http://backend;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        location = /api/daemon/ws {
            proxy_pass http://backend;
            proxy_buffering off;
            proxy_read_timeout 86400s;
        }

        # Backend paths, as in upstream's runtime rewrite list (apps/web/config/runtime-urls.ts).
        location /api/ {
            proxy_pass http://backend;
            proxy_buffering off;
        }

        location /v1/ {
            proxy_pass http://backend;
            proxy_buffering off;
        }

        location /uploads/ {
            proxy_pass http://backend;
        }

        location = /health {
            proxy_pass http://backend;
        }

        # /auth/* belongs to the backend except the web app's OAuth landing pages.
        location /auth/ {
            proxy_pass http://backend;
        }

        location = /auth/callback {
            proxy_pass http://web;
        }

        location /auth/callback/ {
            proxy_pass http://web;
        }

        location /auth/hg-sso/callback {
            proxy_pass http://web;
        }

        # Readiness and metrics stay internal.
        location ~ ^/(readyz|healthz|metrics)$ {
            return 404;
        }

        location / {
            proxy_pass http://web;
        }
    }
}
